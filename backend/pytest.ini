[pytest]
testpaths = tests
addopts = -ra --strict-markers --strict-config
markers =
    no_auth_mock: opt out of the autouse auth mock and exercise the real JWT verification path
filterwarnings =
    # Treat *our* deprecation warnings as errors so we don't ship new ones.
    error::DeprecationWarning:app.*
    error::DeprecationWarning:tests.*
    # Third-party libraries (Pydantic, LlamaIndex, FastAPI, etc.) emit deprecation
    # warnings we don't control — keep those visible but non-fatal.
    default::DeprecationWarning
